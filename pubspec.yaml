name: insubite
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase - todas juntas y compatibles
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_messaging: ^16.1.1
  firebase_database: ^12.1.2 
  firebase_app_check: ^0.4.1+4
  google_sign_in: ^7.2.0 

  # Otras dependencias
  http: ^1.4.0
  provider: ^6.1.1
  sqflite: ^2.3.2
  path: ^1.9.0
  google_fonts: ^8.0.0
  flutter_animate: ^4.2.0
  cupertino_icons: ^1.0.8
  flutter_slidable: ^4.0.0
  flutter_typeahead: ^5.1.1
  intl: ^0.20.2
  fl_chart: ^1.0.0
  path_provider: ^2.0.7
  logger: ^2.6.1
  screenshot: ^3.0.0
  url_launcher: ^6.3.1
  openfoodfacts: ^3.29.0
  rxdart: ^0.28.0

  # ML Kit
  google_mlkit_commons: ^0.11.0
  google_mlkit_image_labeling: ^0.14.1
  image_picker: ^1.2.0
  tflite_flutter: ^0.12.1

  # UI / gráficos / utilidades
  syncfusion_flutter_charts: ^32.1.24
  flutter_date_pickers: ^0.4.3
  shared_preferences: ^2.5.3
  lottie: ^3.3.2
  flutter_screenutil: ^5.9.0
  gestures: ^1.0.0
  uuid: ^4.5.1
  animate_do: ^4.2.0
  permission_handler: ^12.0.1
  push: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_logo.png
